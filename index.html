 let loading=false;

  if(started||loading)return;
  loading=true;
  if(mediaArchiveUrl){
   enterButton.disabled=true;
   for(const field of form.querySelectorAll('select'))field.disabled=true;
   skipButton.hidden=true;
   feedback.textContent='正在载入回忆…';
   try{
    const letter=await window.loadWalkMedia(mediaArchiveUrl);
    if(letter){
     const body=story.querySelector('.letter-body');
     const paragraph=text=>{
      const element=document.createElement('p');
      element.textContent=text;
      return element;
     };
     body.before(paragraph(letter.greeting));
     body.replaceChildren(...letter.paragraphs.map(paragraph));
    }
   }catch{
    feedback.textContent='暂时载入不了照片、视频和信。';
    enterButton.disabled=false;
    enterButton.textContent='重试';
    skipButton.hidden=false;
    loading=false;
    return;
   }
  }
  showStory(state,fromGate);
 }

  const previous=day.value;
  const maximum=month.value?new Date(Number(year.value)||2000,Number(month.value),0).getDate():31;
  day.options.length=1;
  for(let value=1;value<=maximum;value++)day.add(new Option(value,value));
  if(Number(previous)<=maximum)day.value=previous;

  if(event.target===year||event.target===month)updateDays();

  fields.forEach(field=>field.removeAttribute('aria-invalid'));

const letterTyping=new WeakMap();
function typeLetter(paper){
  const sheet=paper.querySelector('.letter-sheet');
  if(!sheet||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const paragraphs=sheet.querySelectorAll('h3,p');
  const glyphs=[];
  const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter('zh',{granularity:'grapheme'}):null;
  for(const block of paragraphs){
    const existing=block.querySelectorAll('.letter-glyph');
    if(existing.length){
      existing.forEach(glyph=>{glyph.classList.remove('letter-typed');glyphs.push(glyph)});
      continue;
    }
    const text=block.textContent;
    const clusters=segmenter?Array.from(segmenter.segment(text),part=>part.segment):Array.from(text);
    const spoken=document.createElement('span');
    spoken.className='letter-spoken';
    spoken.textContent=text;
    const visible=document.createElement('span');
    visible.setAttribute('aria-hidden','true');
    for(const cluster of clusters){
      const mark=document.createElement('span');
      mark.className='letter-glyph';
      mark.textContent=cluster;
      visible.append(mark);
      glyphs.push(mark);
    }
    block.replaceChildren(spoken,visible);
  }

  let cancelled=false,frame=0,index=0,nextAt=0;
  function showNext(now){
    if(cancelled||paper.hidden||!paper.isConnected)return;
    if(now>=nextAt){
      const glyph=glyphs[index++];
      glyph.classList.add('letter-typed');
      nextAt=now+(/[。！？]/.test(glyph.textContent)?120:32);
    }
    if(index<glyphs.length)frame=requestAnimationFrame(showNext);
    else letterTyping.delete(paper);
  }
  letterTyping.set(paper,()=>{
    cancelled=true;
    cancelAnimationFrame(frame);
    glyphs.forEach(glyph=>glyph.classList.add('letter-typed'));
  });
  const unfold=paper.getAnimations().filter(animation=>animation.animationName==='letter-unfurls');
  Promise.allSettled(unfold.map(animation=>animation.finished)).then(()=>{
    if(!cancelled&&!paper.hidden&&glyphs.length)frame=requestAnimationFrame(showNext);
  });
}

function setLetterOpen(desk,cover,paper,open){
  desk.toggleAttribute('data-letter-open',open);
  cover.inert=open;
  cover.setAttribute('aria-expanded',String(open));
  paper.hidden=!open;
  const cancelTyping=letterTyping.get(paper);
  if(cancelTyping){cancelTyping();letterTyping.delete(paper)}
  if(open){
    paper.scrollTop=0;
    typeLetter(paper);
  }
}

function playLetterCut(layer,items,variant,options={}){
  const {sample=false,reduced=false,onToday=()=>{},onCollageReady,finalScene,onDone=()=>{},openPhoto,onEdit,poses,layers,backdrop}=options;
  const animations=[],timers=[],cleanups=[];
  const add=(parent,tag,cls,text)=>{
    const node=document.createElement(tag);
    node.className=cls;
    if(text)node.textContent=text;
    parent.append(node);
    return node;
  };
  const run=(node,frames,duration,delay=0,easing='ease-out',fill='both')=>{
    animations.push(node.animate(frames,{duration,delay,easing,fill}));
  };
  const at=(callback,delay)=>timers.push(setTimeout(callback,delay));
  const label=(parent,cls,top,bottom)=>{
    const title=add(parent,'div',cls);
    add(title,'small','',top);add(title,'strong','',bottom);
    return title;
  };
  const print=(parent,item,onOpen,label)=>{
    const card=add(parent,onOpen?'button':'figure','cut-print');
    if(onOpen){
      card.type='button';
      card.setAttribute('aria-label',label);
      card.onclick=()=>onOpen(card);
      card.hidden=true;
    }
    if(typeof item==='string'){
      const image=add(card,'img','');image.alt='';image.src=walkMediaUrl(item);
    }else if(item){
      const clip=add(card,'video','');
      clip.defaultMuted=true;
      clip.muted=true;
      clip.playsInline=true;
      clip.loop=true;
      clip.preload='auto';
      clip.src=walkMediaUrl(item.src);
      clip.setAttribute('aria-hidden','true');
      cleanups.push(()=>clip.pause());
    }
    return card;
  };
  function stop(){
    timers.forEach(clearTimeout);animations.forEach(animation=>animation.cancel());
    cleanups.forEach(cleanup=>cleanup());
    if(loan){loan.home.append(loan.chapter,loan.cover);loan=null}
    layer.replaceChildren();layer.hidden=true;layer.inert=true;layer.setAttribute('aria-hidden','true');
  }
  layer.replaceChildren();layer.hidden=false;
  layer.dataset.cut=variant;
  const montage=add(layer,'div','cut-montage');
  const bridge=add(layer,'div','cut-bridge');
  let loan=variant==='film'?finalScene:null;
  const envelope=loan?loan.cover:add(bridge,'div','cut-envelope');
  const chapter=loan?loan.chapter:label(bridge,'cut-stamp','第三篇','给你的一封信');
  const seal=loan?envelope.querySelector('span'):add(envelope,'span','','♥');
  if(loan){
    envelope.hidden=false;chapter.hidden=false;
    bridge.append(envelope,chapter);
  }else{
    add(envelope,'b','','给Vv BB：');
  }
  const today=label(montage,'cut-today','第二篇 · 完','走到今天');
  const opening=add(montage,'p','cut-opening','后来，我们还是常常一起出门。');
  const count=Math.min(12,items.length);
  const filmItems=Array.from({length:count},(_,i)=>items[Math.floor(i*items.length/count)]);
  const slides=openPhoto?items:filmItems;
  const cards=slides.map((item,index)=>{
    const level=layers?.[index];
    const label=(typeof item==='string'?'放大照片':'放大视频')+' '+(index+1);
    const onOpen=openPhoto&&level!=='underlay'?card=>openPhoto(item,index,card):null;
    const card=print(montage,item,onOpen,label);
    if(level)card.dataset.layer=level;
    if(level==='underlay'){
      card.hidden=true;
      card.setAttribute('aria-hidden','true');
    }
    return card;
  });
  if(openPhoto){
    layer.inert=false;
    layer.removeAttribute('aria-hidden');
  }
  let editButton;
  if(onEdit){
    editButton=add(montage,'button','collage-edit','排版');
    editButton.type='button';editButton.hidden=true;editButton.onclick=onEdit;
  }
  const sampleBadge=sample?add(montage,'small','cut-sample','示意照片'):null;
  const step=count>8?225:285;
  const reveal=850+step*count;
  const leave=reveal+600;
  const finished=leave+1740;
  if(variant==='film'){
    arrangeFilmCut({layer,montage,bridge,sampleBadge,envelope,seal,chapter,today,opening,cards,slides,print,add,run,at,cleanups,onToday,onCollageReady,reduced,poses,editButton,backdrop,
      finish:()=>{stop();onDone()}
    });
    return stop;
  }
  if(reduced){
    montage.replaceChildren(today);
    bridge.hidden=true;
    at(onToday,0);
    at(()=>{stop();onDone()},900);
    return stop;
  }
  cards.forEach((card,index)=>{
    const slot=index%6;
    const x=[-55,44,-40,51,-21,13][slot],y=[-66,-47,2,17,75,80][slot],r=[-16,12,-9,17,-12,8][slot];
    const direction=index%2?1:-1;
    run(card,[
      {opacity:0,transform:'translate('+direction*210+'%,12%) rotate('+direction*28+'deg) scale(.53)'},
      {opacity:1,transform:'translate('+x+'%,'+y+'%) rotate('+r+'deg) scale(1.08)',offset:.73},
      {opacity:1,transform:'translate('+x+'%,'+y+'%) rotate('+r+'deg)'}
    ],440,120+index*step);
    run(card,[
      {transform:'translate('+x+'%,'+y+'%) rotate('+r+'deg)'},
      {transform:'translate(35%,-2%) rotate('+r*.18+'deg) scale(.48)',opacity:0}
    ],560,leave,'cubic-bezier(.55,.02,.78,.63)');
    animations.at(-1).effect.updateTiming({fill:'forwards'});
  });
  run(opening,[{opacity:1},{opacity:0}],250,Math.max(200,reveal-800));
  run(today,[{opacity:0,transform:'translateY(9px)'},{opacity:1,transform:'none'}],420,reveal);
  run(montage,[{opacity:1},{opacity:0}],520,leave+230);
  animations.at(-1).effect.updateTiming({fill:'forwards'});
  at(onToday,leave+200);
  if(variant==='pixel'){
    const rows=['01100110','11111111','11111111','01111110','00111100','00011000'];
    rows.forEach((row,y)=>[...row].forEach((cell,x)=>{
      if(cell!=='1')return;
      const pixel=add(bridge,'i','cut-pixel');
      bridge.insertBefore(pixel,envelope);
      const dx=(x-4)*91,dy=(y-3)*91;
      pixel.style.setProperty('--pixel',['#f7b4bc','#dc7e9a','#ffdbba'][(x+y)%3]);
      run(pixel,[
        {opacity:0,transform:'translate('+dx*2.2+'%,'+dy*2+'%) scale(.2)'},
        {opacity:1,transform:'translate('+dx+'%,'+dy+'%)',offset:.42},
        {opacity:1,transform:'translate('+dx+'%,'+dy+'%)',offset:.64},
        {opacity:0,transform:'translate(-50%,-50%) scale(.1)'}
      ],1050,leave+(x+y)%4*35,'cubic-bezier(.23,.7,.33,1)');
    }));
  }else{
    envelope.dataset.fold='';
    envelope.style.setProperty('--flap-delay',(leave+650)+'ms');
  }
  const start=variant==='fold'?leave+350:leave+850;
  run(envelope,[
    {opacity:0,transform:variant==='fold'?'translateY(10%) rotate(-13deg) scale(.46)':'translateY(20%) scale(.75)'},
    {opacity:1,transform:'translateY(-2%) rotate(2deg) scale(1.03)',offset:.72},
    {opacity:1,transform:'none'}
  ],620,start,'cubic-bezier(.21,.66,.3,1)');
  run(chapter,[{opacity:0,transform:'translateY(11px)'},{opacity:1,transform:'none'}],370,start+350);
  at(()=>{stop();onDone()},Math.max(finished,start+740));
  return stop;
}
function startBeachScene(canvas){
  const output=canvas.getContext('2d',{alpha:false});
  if(!output)return ()=>{};
  const format=matchMedia('(prefers-reduced-motion: reduce)');
  const width=300,height=533;
  canvas.width=width;
  canvas.height=height;
  const surface=document.createElement('canvas');
  surface.width=width;surface.height=height;
  let draw;
  try{
    const gl=surface.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false,failIfMajorPerformanceCaveat:false,powerPreference:'low-power'});
    if(gl){
      const vertex=`
        attribute vec2 position;
        void main(){gl_Position=vec4(position,0.0,1.0);}
      `;
      const fragment=`
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif
        uniform vec2 size;
        uniform float seconds;
        const float horizon=.305;
        const float sunX=.66;

        float hash(vec2 p){
          vec3 q=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));
          q+=dot(q,q.yzx+33.33);
          return fract((q.x+q.y)*q.z);
        }
        float noise(vec2 p){
          vec2 i=floor(p),f=fract(p);
          f=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),
                     mix(hash(i+vec2(0.,1.)),hash(i+1.),f.x),f.y);
        }
        float broadNoise(vec2 p){
          return .59*noise(p)+.29*noise(p*2.06+9.1)+.12*noise(p*4.2+19.7);
        }
        vec3 sky(vec2 p){
          float up=clamp((horizon-p.y)/horizon,0.,1.);
          vec3 col=mix(vec3(.96,.63,.50),vec3(.34,.37,.56),pow(up,.73));
          vec2 s=vec2(p.x-sunX,(p.y-.259)*1.775);
          float sunDist=length(s);
          col=mix(col,vec3(1.,.70,.46),exp(-sunDist*6.)*.65);
          col+=vec3(.12,.063,.025)*exp(-sunDist*15.);
          float broad=broadNoise(vec2(p.x*5.2+seconds*.007,p.y*22.));
          float fine=broadNoise(vec2(p.x*8.1-.38,p.y*45.+4.));
          float cloudLayer=smoothstep(.49,.71,broad+.10*fine)*smoothstep(.008,.10,up);
          float cloudLining=smoothstep(.470,.58,broad+.10*fine)-smoothstep(.56,.67,broad+.10*fine);
          col=mix(col,vec3(.35,.33,.50)+vec3(.13,.055,.035)*(1.-up),cloudLayer*.73);
          col+=vec3(.17,.075,.059)*max(0.,cloudLining)*pow(1.-up,1.7);
          float disk=1.-smoothstep(.033,.037,sunDist);
          disk*=1.-cloudLayer*.63;
          col=mix(col,vec3(1.,.897,.68),disk*.99);
          return col;
        }
        float shoreline(float x){
          return .447+.138*x+.014*sin(x*5.1-1.3)-.012*sin(x*9.4);
        }
        float shoreRim(float x,float time){
          float cycle=fract((time+x*.95)*.177);
          float surge=smoothstep(.09,.48,cycle)*(1.-smoothstep(.54,.96,cycle));
          return shoreline(x)+.030*(surge-.33)+.004*sin(14.*x-time*.73)+
            .005*(noise(vec2(x*11.+2.,time*.31))-.5);
        }
        float crest(vec2 p,float t,float offset,float speed){
          float phase=fract(t*speed+offset);
          float x=p.x;
          float y=mix(horizon+.018,shoreline(x)-.004,pow(phase,1.65));
          y+=.007*sin(x*12.-offset*7.+t*.47)*phase+
             .008*(noise(vec2(x*13.+offset,t*.42))-.5)*phase;
          float visible=smoothstep(.08,.25,phase)*(1.-smoothstep(.78,1.,phase));
          float width=.0008+.006*phase*phase;
          float ridge=exp(-abs(p.y-y)/width);
          return ridge*visible;
        }
        vec3 sea(vec2 p,float t,float shore){
          float z=max(.001,p.y-horizon);
          float near=clamp(z/max(.03,shore-horizon),0.,1.);
          float perspective=1./(z+.045);
          vec2 water=vec2((p.x-.5)*perspective*.53,perspective*.43);
          float large=sin(water.y*12.6+sin(water.x*3.1+t*.36)-t*.95);
          float riffles=sin(water.y*22.1+water.x*4.9-t*1.51);
          float jagged=noise(vec2(water.x*10.+t*.13,water.y*8.-t*.27));
          float ripples=(large*.59+riffles*.21+(jagged-.5)*.60)*smoothstep(.0,.036,z);
          vec3 color=mix(vec3(.47,.43,.55),vec3(.14,.27,.38),smoothstep(.003,.19,z));
          color=mix(color,vec3(.19,.32,.40),smoothstep(.57,1.,near)*.68);
          color+=vec3(.084,.087,.098)*ripples;
          float fleck=hash(floor(p*size*.90));
          color+=vec3(.024,.023,.025)*(fleck-.5);
          float tip=crest(p,t,.03,.14)+crest(p,t,.44,.149)*.72+crest(p,t,.73,.135)*.68;
          float breakup=smoothstep(.31,.71,noise(vec2(p.x*77.+t*.28,p.y*86.)));
          color=mix(color,vec3(.66,.72,.74),min(.45,tip*.42)*(.24+breakup*.76));
          float glowWidth=.022+z*.28;
          float offset=(noise(vec2(p.y*125.+1.5,t*.54))-.5)*glowWidth*.77;
          float sunOffset=(p.x-sunX+offset)/glowWidth;
          float reflection=exp(-sunOffset*sunOffset);
          float glitter=smoothstep(.53,.89,noise(vec2(p.x*151.+t*1.2,p.y*321.-t*2.3)));
          color=mix(color,vec3(.99,.64,.41),reflection*(.19+glitter*.52)*(1.-.5*near));
          color+=vec3(.10,.057,.038)*reflection*glitter;
          return color;
        }
        vec3 beach(vec2 p,float t,float shore){
          float dist=p.y-shore;
          float far=clamp(dist/.38,0.,1.);
          vec3 dry=mix(vec3(.53,.359,.338),vec3(.43,.274,.269),far);
          vec3 wet=mix(vec3(.23,.293,.348),vec3(.388,.323,.356),smoothstep(-.005,.053,dist));
          float wetDepth=.066+.018*noise(vec2(p.x*7.-.6,4.63))+
                         .006*sin(p.x*16.+2.);
          vec3 color=mix(wet,dry,smoothstep(wetDepth-.022,wetDepth+.043,dist));
          float grain=hash(floor(p*size));
          float mottles=broadNoise(p*vec2(82.,46.));
          float sandTexture=noise(p*vec2(235.,125.));
          color+=vec3(.092,.079,.070)*(grain-.5)*mix(.46,1.,far);
          color+=vec3(.073,.043,.040)*(mottles-.5);
          color+=vec3(.030,.025,.026)*(sandTexture-.5);
          float trace=dist-.043-.014*sin(p.x*8.+1.)-.008*noise(vec2(p.x*16.,7.));
          color-=vec3(.044,.031,.037)*exp(-abs(trace)*198.)*(.28+.72*mottles);
          float sunOffset=(p.x-sunX+sin(p.y*52.)*.011)/(.16+dist*.08);
          float glow=exp(-sunOffset*sunOffset);
          color=mix(color,vec3(.67,.411,.412),glow*exp(-max(0.,dist)*12.)*.38);
          return color;
        }
        void main(){
          vec2 p=vec2(gl_FragCoord.x/size.x,1.-gl_FragCoord.y/size.y);
          float t=seconds;
          vec3 color;
          if(p.y<horizon){
            color=sky(p);
            float headland=horizon-.013*(1.-smoothstep(.0,.26,p.x))-.008*noise(vec2(p.x*20.,6.));
            float land=smoothstep(headland,headland+.003,p.y)*(1.-smoothstep(.02,.33,p.x));
            color=mix(color,vec3(.34,.32,.44),land*.87);
          }else{
            float shore=shoreRim(p.x,t);
            float d=p.y-shore;
            vec3 sand=beach(p,t,shore);
            if(d<.031){
              float wash=1.-smoothstep(-.023,.005,d);
              color=mix(sand,sea(p,t,shore),wash);
              float coarse=noise(vec2(p.x*67.+t*.45,p.y*169.-t*.52));
              float lace=noise(vec2(p.x*177.-t*.70,p.y*298.+t*.89));
              float turbulent=.53*coarse+.47*lace;
              float scallop=d+.008*(coarse-.48);
              float froth=exp(-abs(scallop)*140.)*
                smoothstep(.23,.77,turbulent+.19)*smoothstep(-.027,-.005,d);
              float secondary=exp(-abs(d+.017+.007*(lace-.5))*139.)*
                smoothstep(.46,.83,turbulent)*.70;
              float whiteRim=exp(-abs(scallop)*410.)*(.36+.64*lace);
              float spindrift=exp(-max(0.,d)*147.)*smoothstep(.002,.010,d)*smoothstep(.67,.79,turbulent)*.58;
              color=mix(color,vec3(.88,.84,.79),clamp(froth*.71+secondary+whiteRim*.50+spindrift,0.,.91));
            }else color=sand;
          }
          color+=(hash(floor(p*size))-.5)*.012;
          gl_FragColor=vec4(clamp(color,0.,1.),1.);
        }
      `;
      const compile=(type,code)=>{
        const shader=gl.createShader(type);
        gl.shaderSource(shader,code);
        gl.compileShader(shader);
        if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(shader));
        return shader;
      };
      const program=gl.createProgram();
      gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));
      gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));
      gl.linkProgram(program);
      if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
      gl.useProgram(program);
      const positions=gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER,positions);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const position=gl.getAttribLocation(program,'position');
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
      gl.viewport(0,0,width,height);
      gl.uniform2f(gl.getUniformLocation(program,'size'),width,height);
      const time=gl.getUniformLocation(program,'seconds');
      draw=seconds=>{
        gl.uniform1f(time,seconds);
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
        output.drawImage(surface,0,0);
      };
    }
  }catch{}
  if(!draw)draw=makeBeachFallback(output,width,height);
  const start=performance.now();
  let frame=0,visible=true,last=0;
  function paint(now){
    frame=0;
    if(!visible||document.hidden)return;
    if(now-last>=29||format.matches){
      draw(format.matches?1.8:(now-start)/1000);
      last=now;
    }
    if(!format.matches)frame=requestAnimationFrame(paint);
  }
  function resume(){
    if(frame||!visible||document.hidden)return;
    frame=requestAnimationFrame(paint);
  }
  const observer=typeof IntersectionObserver==='function'?new IntersectionObserver(entries=>{
    visible=entries[0].isIntersecting;
    if(visible)resume();
  }):null;
  observer?.observe(canvas);
  document.addEventListener('visibilitychange',resume);
  format.addEventListener?.('change',resume);
  draw(1.8);
  resume();

}

function makeBeachFallback(ctx,w,h){
  const unit=w/300,horizon=h*.305;
  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#666487');sky.addColorStop(.58,'#b37f92');sky.addColorStop(1,'#e6a27e');
  const sand=ctx.createLinearGradient(0,h*.46,0,h);
  sand.addColorStop(0,'#9a6f71');sand.addColorStop(.48,'#876162');sand.addColorStop(1,'#6d484a');
  const water=ctx.createLinearGradient(0,horizon,0,h*.73);
  water.addColorStop(0,'#8b798b');water.addColorStop(.32,'#54667e');water.addColorStop(1,'#365769');
  const reflect=ctx.createRadialGradient(w*.657,horizon,0,w*.657,horizon,w*.50);
  reflect.addColorStop(0,'#ffb07d9a');reflect.addColorStop(1,'#ffb07d00');
  const dust=Array.from({length:2200},(_,i)=>{
    const seed=Math.sin(i*272.7)*8347.3,x=(seed-Math.floor(seed))*w;
    const n=Math.sin(i*87.13)*3245.5,y=h*(.46+.54*(n-Math.floor(n)));
    return [x,y,w*(.001+(i%5)*.0004),i%3];
  });
  const coast=(x,t)=>h*(.447+.138*x/w+.014*Math.sin(x/w*5.1-1.3)-.012*Math.sin(x/w*9.4)
    +.017*Math.sin(t*.79+x/w*.68)+.004*Math.sin(x/w*28.-t*.83));
  function path(y){
    ctx.beginPath();
    for(let x=0;x<=w;x+=3*unit){
      if(x===0)ctx.moveTo(x,y(x));else ctx.lineTo(x,y(x));
    }
  }
  return time=>{
    ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon);
    const sunset=ctx.createRadialGradient(w*.66,h*.259,0,w*.66,h*.259,w*.28);
    sunset.addColorStop(0,'#ffe5a8e6');sunset.addColorStop(.18,'#ffb5837d');sunset.addColorStop(1,'#ffb58300');
    ctx.fillStyle=sunset;ctx.fillRect(0,0,w,horizon);
    ctx.fillStyle='#ffe6b2';ctx.beginPath();ctx.arc(w*.66,h*.259,10*unit,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=sand;ctx.fillRect(0,horizon,w,h-horizon);
    for(const [x,y,s,k] of dust){ctx.fillStyle=k===0?'#f6c0a61a':'#3f374328';ctx.fillRect(x,y,s,.8*unit)}
    path(x=>coast(x,time)+h*.055);
    ctx.lineTo(w,horizon);ctx.lineTo(0,horizon);ctx.closePath();ctx.fillStyle='#535666';ctx.fill();
    path(x=>coast(x,time));
    ctx.lineTo(w,horizon);ctx.lineTo(0,horizon);ctx.closePath();
    ctx.fillStyle=water;ctx.fill();ctx.fillStyle=reflect;ctx.fill();
    ctx.save();ctx.clip();
    for(let i=0;i<65;i++){
      const depth=(i+1)/65;
      const x=w*((Math.sin(i*11.45)*743.23)%1+.3);
      const y=horizon+(h*.405)*depth;
      ctx.fillStyle=i%3?'#d8c6c62d':'#edb4a45b';
      ctx.fillRect(x+Math.sin(time*1.1+i)*8*unit,y,unit*(4+i%17)*depth,1*unit);
    }
    ctx.restore();
    for(let i=0;i<3;i++){
      const q=((time*.145+i*.35)%1);
      const rise=Math.sin(q*Math.PI);
      path(x=>horizon+(coast(x,time)-horizon)*(.08+.91*q*q)+h*.006*rise*Math.sin(x/w*17.+time*.4));
      ctx.strokeStyle='rgba(225,225,219,'+(.44*rise)+')';ctx.lineWidth=unit*(.7+2.7*q);ctx.stroke();
    }
    path(x=>coast(x,time));
    ctx.lineWidth=4.5*unit;ctx.strokeStyle='#d5c6bf6a';ctx.stroke();
    ctx.lineWidth=1.4*unit;ctx.strokeStyle='#ede4d9b7';ctx.stroke();
  };
}

 if(noteChanged&&!note.hidden)revealCaption(note,headingChanged?125:0);
 updateCues();paint();weather();
}
function save(){
 if(stopLetterCut)return;
 const state={dateUnlocked:true,letterReady,voiceRoomReady,storyRevision:4,edition:'campus-approach-1',scene,beat,phase,position,photoShown,albumOpen:!album.hidden,dailyView,graduationPhoto,phoneFirstMessageShown};
 if(albumGate()){
  const key=current().album,{list,sample}=urls();
  state.albumProgress={
   key,source:trials.has(key)?'trial':sample?'sample':'original',
   count:list.length,index:gatedPhotoIndex,seen:[...seenAlbumPhotos]
  };
 }
 const signature=JSON.stringify(state);if(signature===lastSaved)return;
 lastSaved=signature;window.openai?.setWidgetState?.({privateContent:state})?.catch(()=>{});
}
function clearFrame(){
 cancelAnimationFrame(frame);frame=0;held=null;
}
function arrive(){
 clearFrame();jump=null;position=current().spot;phase='dialogue';beat=0;photoShown=false;phoneFirstMessageShown=false;
 if(current().albumContinue){seenAlbumPhotos.clear();gatedPhotoIndex=0}
 if(current().album==='2026-07-10')graduationPhoto=0;
 closeAlbum();
 if(openEverydayAlbum){openEverydayAlbum=false;openAlbum()}
 else if(current().photoBeat===0&&urls().list.length)openAlbum();
 dailyView='paper';update();save();
}
function advanceLine(){
 if(closeMontageEditor)return;
 if(continueLetterCut&&album.hidden){
  const resume=continueLetterCut;
  sound.play('film');
  continueLetterCut=null;
  updateCues();
  resume();
  return;
 }
 if(albumGate()&&album.hidden){openAlbum();save();return}
 if(phoneMode())return;
 if(!album.hidden||phase!=='dialogue'||jump||stopLetterCut||letterReady||capture||beatWaiting())return;
 if(photoCue()){takeScenePhoto();return}
 if(scene===everydayScene||scene===last){startLetterCut();return}
 if(lastLine())return;
 nextStoryBeat();
}
function tick(now){
 frame=0;
 const dt=Math.max(0,Math.min(80,now-previous));previous=now;
 if(jump){
  jump.elapsed+=dt;
  const t=Math.min(1,jump.elapsed/jump.duration);
  position=jump.from+(current().spot-jump.from)*t*t*(3-2*t);
  if(t===1){arrive();return}
 }else if(held!==null&&phase==='path'){
  const msPerUnit=scene===chapterIntro+1?3000/(current().spot-scenes[chapterIntro].spot):2100;
  position=Math.min(current().spot,position+dt/msPerUnit);
  if(position>=current().spot){arrive();return}
 }else return;
 paint();frame=requestAnimationFrame(tick);
}
function animate(){
 clearTimeout(weatherTimer);previous=performance.now();frame=requestAnimationFrame(tick);
}
function begin(id){
 if(closeMontageEditor||stopLetterCut||letterReady||scene===everydayScene&&phase==='dialogue'||albumGate()||!album.hidden||jump||held!==null||phonePlaying())return;
 if(phase!=='path'){
  if(scene===last||(phase==='dialogue'&&!lastLine()))return;
  closeAlbum();scene++;beat=0;phase='path';photoShown=false;
 }
 held=id;update();animate();
}
function release(id){
 if(held!==id)return;
 clearFrame();updateCues();paint();save();weather();
}
// Capture story gestures on the whole player. Dedicated controls and the photo deck handle their own gestures.
let touch=null,holdTimer=0;
function discardTouch(){
 clearTimeout(holdTimer);
 if(touch){const id=touch.id;touch=null;release(id)}
}
root.onpointerdown=e=>{
 if(!album.hidden||closeMontageEditor||phonePlaying()||!e.isPrimary||e.button!==0||touch||e.target.closest('.directory,.album,.next,.letter-desk,.letter-cut button,.voice-room,.sound-toggle'))return;
 touch={id:e.pointerId,x:e.clientX,y:e.clientY,long:false,canRead:phase==='dialogue'&&!jump};
 root.setPointerCapture(e.pointerId);
 holdTimer=setTimeout(()=>{
  if(!touch)return;
  touch.long=true;begin(touch.id);
 },190);
};
root.onpointermove=e=>{
 if(touch&&e.pointerId===touch.id&&!touch.long&&Math.hypot(e.clientX-touch.x,e.clientY-touch.y)>10)discardTouch();
};
root.onpointerup=e=>{
 if(!touch||touch.id!==e.pointerId)return;
 const tap=touch.canRead&&!touch.long&&Math.hypot(e.clientX-touch.x,e.clientY-touch.y)<=10;
 discardTouch();if(tap)advanceLine();
};
root.onpointercancel=root.onlostpointercapture=e=>{if(touch?.id===e.pointerId)discardTouch()};
stage.oncontextmenu=speech.oncontextmenu=e=>e.preventDefault();
stage.onkeydown=e=>{
 if(e.key!==' '&&e.key!=='ArrowRight')return;
 e.preventDefault();if(!e.repeat)begin(e.code);
};
window.addEventListener('keyup',e=>release(e.code));
speech.onclick=stage.onclick=e=>{if(e.detail===0)advanceLine()};
nextButton.onclick=advanceLine;
function suspend(){
 if(!visible||document.hidden)clearTimeout(phoneTimer);
 discardTouch();
 if(held!==null)release(held);
 cancelAnimationFrame(frame);frame=0;clearTimeout(weatherTimer);
 if(!jump)save();
}
function resume(){if(visible&&!document.hidden){if(jump&&!frame)animate();else weather();syncPhoneTimer()}}
window.addEventListener('blur',suspend);window.addEventListener('focus',resume);
document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();else resume()});
menu.onchange=()=>{
 const raw=menu.value;if(raw==='')return;
 if(raw==='edit-montage'){
  menu.value='';
  discardTouch();
  editMontage(Boolean(stopLetterCut));
  return;
 }
 discardTouch();clearFrame();clearCapture();resetLetter();closeAlbum();menu.value='';
 openEverydayAlbum=raw==='everyday-album';
 if(raw==='entrance'){
  jump=null;scene=0;beat=0;phase='path';position=entrance;photoShown=false;update();save();return;
 }
 scene=openEverydayAlbum?everydayScene:Number(raw);beat=0;phase='path';photoShown=false;
 if(Math.abs(current().spot-position)<.001||reduced.matches){arrive();return}
 jump={from:position,elapsed:0,duration:Math.min(1600,320+Math.abs(current().spot-position)*320)};
 update();animate();
};
el('.close-album').onclick=()=>{
 if(albumGate()&&seenAlbumPhotos.size>=urls().list.length){
  if(current().album==='2026-07-10'){
   sound.play('photo');
   graduationPhoto=photoIndex;scene=chapterIntro;arrive();
  }else{
   scene++;beat=0;phase='path';photoShown=false;
   closeAlbum();update();save();
  }
  stage.focus({preventScroll:true});return;
 }
 closeAlbum(true);save();weather();
};
album.onkeydown=e=>{
 if(e.target!==video&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();turnPhoto(e.key==='ArrowRight'?1:-1)}
};
el('input').onchange=e=>{
 const files=[...e.target.files],key=current().album;
 if(!key||!files.length)return;
 const prior=trials.get(key)||(mixedAlbum()?window.walkAlbums?.[key]:null)||[];
 if(albumGate()&&!prior.length)seenAlbumPhotos.clear();
 trials.set(key,prior.concat(files.map(file=>{
   const src=URL.createObjectURL(file);
   return mixedAlbum()&&(file.type.startsWith('video/')||/\.(mp4|m4v|mov|webm|ogv)$/i.test(file.name))?{type:'video',src}:src;
 })));photoIndex=prior.length;
 e.target.value='';showPage();save();
};
function restore(st){
 const s=st?.privateContent;
 if(!s||closeMontageEditor||roomFlight||held!==null||jump||stopLetterCut||capture||!scenes.length)return;
 let restored=s;
 if(s.edition==='continuous-1'&&Number.isFinite(s.elapsed)){
  let remaining=s.elapsed,found=false;
  for(const [i,entry] of scenes.filter(entry=>entry.spot%1===0).entries()){
   for(const [j,b] of entry.beats.entries()){
    const duration=Math.max(1900,Math.min(4200,900+[...b.line].length*95))+(entry.album&&entry.photoBeat===j?1600:0);
    remaining-=duration;
    if(remaining<0||(i===12&&j===entry.beats.length-1)){
     restored={...s,scene:i,beat:j,phase:'dialogue',position:i};found=true;break;
    }
   }
   if(found)break;
  }
 }else if(s.edition==='dialogue-1')restored={...s,phase:'dialogue',position:s.scene};
 else if(!['campus-approach-1','two-parts-1','walk-and-read-1'].includes(s.edition))return;
 if(!['campus-approach-1','two-parts-1'].includes(s.edition)&&restored.scene>=6){
  restored={...restored,scene:restored.scene+1};
  // The inserted stop splits the old graduation-to-lunch path.
  if(restored.phase==='path'&&restored.scene===7&&restored.position<scenes[6].spot)restored.scene=6;
 }
 if(s.edition!=='campus-approach-1'&&restored.scene===0&&restored.phase==='path'&&restored.position===-.43)
  restored={...restored,position:entrance};
 if(s.edition!=='continuous-1'&&(!s.storyRevision||s.storyRevision<2)&&restored.phase==='dialogue'){
  const oldBeatMap={
   2:[4,5,6,6],5:[0,2,4,5],6:[0,1,2,2,2,3],7:[0,1,1],8:[0,0,1,2],
   9:[0,1,1],10:[0,1,2,2],13:[0,0,0,1],14:[0,0,0],15:[0,0]
  };
  const mapped=oldBeatMap[restored.scene]?.[restored.beat];
  if(mapped!==undefined)restored={...restored,beat:mapped};
 }
 if(s.edition!=='continuous-1'&&(!s.storyRevision||s.storyRevision<3)&&restored.scene===2&&restored.phase==='dialogue'&&restored.beat>=2){
  restored={...restored,beat:restored.beat+1};
 }
 if(s.edition!=='continuous-1'&&(!s.storyRevision||s.storyRevision<4)&&restored.phase==='dialogue'){
  const mapped={6:[0,1,4,5],7:[0,3],10:[0,1,4],11:[0,5,6,11]}[restored.scene]?.[restored.beat];
  if(mapped!==undefined)restored={...restored,beat:mapped};
 }
 const r=restored;
 const restoredView=['paper','lock','chat'].includes(r.dailyView)?r.dailyView:'paper';
 const restoredScene=scenes[r.scene];
 const restoredPhone=r.phase==='dialogue'&&(restoredScene?.beats[r.beat]?.phone||restoredScene?.phone);
 const restoredFirstMessage=r.phoneFirstMessageShown??(restoredPhone==='research'
  ?r.researchMessageShown??true
  :Boolean(restoredPhone&&(restoredPhone!=='daily'||restoredView==='chat')));
 const restoredPhoto=Number.isInteger(r.graduationPhoto)&&r.graduationPhoto>=0?r.graduationPhoto:0;
 if(!Number.isInteger(r.scene)||!scenes[r.scene]||!Number.isInteger(r.beat)||!scenes[r.scene].beats[r.beat]||
  !['path','dialogue','ready'].includes(r.phase)||!Number.isFinite(r.position))return;
 const dest=scenes[r.scene].spot, from=r.scene?scenes[r.scene-1].spot:entrance;
 if(r.position<from||r.position>dest||(r.phase!=='path'&&r.position!==dest))return;
 if(letterReady===!!r.letterReady&&voiceRoomReady===!!r.voiceRoomReady&&scene===r.scene&&beat===r.beat&&position===r.position&&phase===r.phase&&photoShown===!!r.photoShown&&(!album.hidden)===!!r.albumOpen&&dailyView===restoredView&&graduationPhoto===restoredPhoto&&phoneFirstMessageShown===restoredFirstMessage)return;
 dailyView=restoredView;graduationPhoto=restoredPhoto;phoneFirstMessageShown=restoredFirstMessage;
 letterReady=Boolean(r.letterReady&&r.scene===last);
 voiceRoomReady=letterReady&&Boolean(r.voiceRoomReady);
 scene=r.scene;beat=r.beat;phase=r.phase;position=r.position;photoShown=!!r.photoShown;closeAlbum();
 if(albumGate()){
  seenAlbumPhotos.clear();gatedPhotoIndex=0;
  const key=current().album,{list,sample}=urls();
  const source=trials.has(key)?'trial':sample?'sample':'original';
  const progress=r.albumProgress||(key==='2026-07-10'?{
   key,source:r.gradSource,count:r.gradCount,index:restoredPhoto,seen:r.gradSeen
  }:null);
  if(progress?.key===key&&progress.source===source&&progress.count===list.length&&Array.isArray(progress.seen)){
   for(const i of progress.seen)if(Number.isInteger(i)&&i>=0&&i<list.length)seenAlbumPhotos.add(i);
   if(seenAlbumPhotos.has(progress.index))gatedPhotoIndex=progress.index;
  }
 }
 if(phase==='dialogue'&&current().album&&urls().list.length&&(r.albumOpen||(!photoShown&&scene!==everydayScene&&beat===current().photoBeat)))openAlbum();
 update();
}
update();restore(initialState);
if(fromGate){
 save();
 (nextButton.hidden?stage:nextButton).focus({preventScroll:true});
 if(!reduced.matches)root.animate([{opacity:.25},{opacity:1}],{duration:300,easing:'ease-out'});
}
window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
if(typeof IntersectionObserver==='function'){
 new IntersectionObserver(([entry])=>{visible=entry.isIntersecting;if(visible)resume();else suspend()}).observe(root);
}
 }
})();

</script>
